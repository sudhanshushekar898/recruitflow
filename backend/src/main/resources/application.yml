spring:
  application:
    name: recruitflow
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    default-property-inclusion: non_null

recruitflow:
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:no-reply@recruitflow.local}
  security:
    jwt:
      # PEM, PKCS#8 private key and X.509 public key. Required outside local/test profiles.
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
